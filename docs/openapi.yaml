openapi: 3.1.0
info:
  title: FormSentinel Phase 3 API
  version: 0.3.0
servers:
  - url: http://localhost:3001
paths:
  /health:
    get:
      responses: { "200": { description: Healthy } }
  /ready:
    get:
      responses: { "200": { description: Durable store ready }, "503": { description: Not ready } }
  /version:
    get:
      responses: { "200": { description: Phase and release metadata } }
  /v1/forms/{publicFormId}/submissions:
    options:
      parameters: [{ $ref: "#/components/parameters/PublicFormId" }]
      responses:
        {
          "204": { description: Exact-origin CORS preflight },
          "403": { $ref: "#/components/responses/Error" },
        }
    post:
      description: Accepts JSON, application/x-www-form-urlencoded, or multipart/form-data. Delivery is asynchronous.
      parameters:
        - $ref: "#/components/parameters/PublicFormId"
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            { schema: { type: object, additionalProperties: { type: [string, number, boolean] } } }
          application/x-www-form-urlencoded: { schema: { type: object } }
          multipart/form-data: { schema: { type: object } }
      responses:
        "202":
          {
            description: Durably accepted and queued,
            content: { application/json: { schema: { $ref: "#/components/schemas/Success" } } },
          }
        "200":
          {
            description: Idempotent replay,
            content: { application/json: { schema: { $ref: "#/components/schemas/Success" } } },
          }
        "303": { description: Configured native HTML redirect }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "431": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "405":
          {
            description: Unsupported method; Allow is POST,
            OPTIONS,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
        "429":
          {
            description: Rate limited; includes Retry-After and X-Request-Id,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /v1/jobs/process:
    post:
      description: Optional manual durable-queue drain. Normal workers poll automatically. Requires SERVICE_TOKEN.
      security: [{ serviceToken: [] }]
      responses: { "200": { description: Drain counts }, "401": { description: Unauthorized } }
  /v1/scans:
    post:
      description: Scanner service bounded static HTML scan. Requires SERVICE_TOKEN; browser-only inspection is reported unavailable.
      security: [{ serviceToken: [] }]
      responses:
        {
          "200": { description: Static scan evidence },
          "401": { description: Unauthorized },
          "422": { description: URL, network policy, response, or scan limit failure },
        }
  /mcp:
    post:
      description: MCP service JSON-RPC endpoint. Requires a hashed scoped user token and X-Workspace-Id; SERVICE_TOKEN is not accepted.
      security: [{ scopedToken: [] }]
      responses:
        {
          "200": { description: JSON-RPC response },
          "400": { description: JSON-RPC error },
          "401": { description: Scope or tenant authorization denied },
          "429": { description: Token rate limited },
        }
components:
  securitySchemes:
    serviceToken: { type: http, scheme: bearer }
    scopedToken:
      {
        type: http,
        scheme: bearer,
        description: One-time-display fsmcp token stored only as a hash,
      }
  parameters:
    PublicFormId: { in: path, name: publicFormId, required: true, schema: { type: string } }
  schemas:
    Success:
      type: object
      required: [success, submission_id, request_id, message]
      properties:
        {
          success: { const: true },
          submission_id: { type: string, format: uuid },
          request_id: { type: string },
          message: { type: string },
        }
    Error:
      type: object
      required: [success, request_id, error]
      properties:
        success: { const: false }
        request_id: { type: string }
        error:
          type: object
          required: [code, message]
          properties:
            {
              code: { type: string },
              message: { type: string },
              fields: { type: object, additionalProperties: { type: string } },
            }
  responses:
    Error:
      {
        description: Structured request error,
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
